name: Inspect Wobble source and build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q grok-workspace.zip -d extracted
          cd extracted
          echo "===== SOURCE FILES ====="
          find src server public -type f -printf '%p | %s bytes\n' 2>/dev/null | sort | head -120
          for f in package.json vercel.json vite.config.ts .vercel/output/config.json; do
            if [ -f "$f" ]; then echo "===== $f ====="; sed -n '1,240p' "$f"; fi
          done
          for f in src/lib/jiggle/engine.ts; do
            if [ -f "$f" ]; then
              echo "===== $f LINES 1-240 ====="; sed -n '1,240p' "$f"
              echo "===== $f LINES 620-780 ====="; sed -n '620,780p' "$f"
            fi
          done
          for f in src/components/jiggle/editor.tsx; do
            if [ -f "$f" ]; then
              echo "===== $f LINES 1-170 ====="; sed -n '1,170p' "$f"
              echo "===== $f LINES 900-1060 ====="; sed -n '900,1060p' "$f"
              echo "===== IMAGE STATE / EVENTS ====="
              grep -nE 'image|Image|onLoad|onError|handleFile|readFile|loadImage|FileReader|createObjectURL|canvasRef|imgRef' "$f" | head -180
            fi
          done
          echo "===== ROUTE FILES ====="
          find src/routes -type f -maxdepth 4 -printf '%p\n' 2>/dev/null | sort
          echo "===== BUILD ====="
          npm ci
          npm run build
