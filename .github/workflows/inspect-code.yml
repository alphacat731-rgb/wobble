name: Inspect Wobble code

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-code.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print app source
        shell: bash
        run: |
          set -euo pipefail
          mkdir extracted
          unzip -q grok-workspace.zip -d extracted
          cd extracted
          echo "=== SOURCE TREE ==="
          find src server public -type f -printf '%p | %s bytes\n' 2>/dev/null | sort | head -100
          for f in package.json vercel.json vite.config.ts .vercel/output/config.json; do
            if [ -f "$f" ]; then echo "=== FILE:$f ==="; sed -n '1,200p' "$f"; fi
          done
          echo "=== ENGINE:1-230 ==="
          sed -n '1,230p' src/lib/jiggle/engine.ts
          echo "=== ENGINE:640-760 ==="
          sed -n '640,760p' src/lib/jiggle/engine.ts
          echo "=== EDITOR:1-170 ==="
          sed -n '1,170p' src/components/jiggle/editor.tsx
          echo "=== EDITOR:900-1040 ==="
          sed -n '900,1040p' src/components/jiggle/editor.tsx
          echo "=== ROUTES ==="
          find src/routes -type f -maxdepth 4 -print 2>/dev/null | sort
          for f in $(find src/routes -maxdepth 2 -type f | sort | head -12); do
            echo "=== ROUTE:$f ==="; sed -n '1,240p' "$f"
          done
