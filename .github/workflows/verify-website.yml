name: Verify Wobble website

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "vercel.json"
      - "tsconfig.json"
      - ".github/workflows/verify-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Test mobile-style image upload against production preview
        run: node scripts/ci/smoke-image-upload.mjs
