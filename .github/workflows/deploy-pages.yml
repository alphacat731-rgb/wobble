name: Deploy Wobble to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium

      - name: Build the static GitHub Pages site
        run: npm run build:pages

      - name: Test the site at the GitHub Pages project path
        run: node scripts/ci/smoke-image-upload.mjs
        env:
          WOBBLE_BASE_PATH: /wobble/
          WOBBLE_PREVIEW_MODE: pages

      - name: Verify the Pages entry point exists
        run: test -s dist/client/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
