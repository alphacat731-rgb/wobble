name: Prepare Wobble website

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prepare-website.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: grok-workspace.zip

      - name: Extract the app and repair image loading
        shell: bash
        run: |
          set -euo pipefail

          mkdir .workspace
          unzip -q grok-workspace.zip -d .workspace

          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.vercel/output' \
            .workspace/ ./
          rm -rf .workspace

          python3 <<'PY'
          from pathlib import Path

          editor_path = Path("src/components/jiggle/editor.tsx")
          editor = editor_path.read_text(encoding="utf-8")
          old_guard = """  async function openFile(file: File) {
              if (!file.type.startsWith("image/")) {
                toast.error("Use a PNG, JPG, or WebP image");
                return;
              }
          """
          new_guard = """  async function openFile(file: File) {
              // Do not trust File.type as the only upload check. Android and
              // other mobile pickers can report valid photos as
              // application/octet-stream or leave the MIME type empty.
              // JiggleEngine.loadFile verifies the actual image signature.
              if (!file.size) {
                toast.error("That file is empty");
                return;
              }
          """
          if old_guard not in editor:
              raise SystemExit("Could not find the expected image MIME guard in editor.tsx")
          editor_path.write_text(editor.replace(old_guard, new_guard, 1), encoding="utf-8")

          engine_path = Path("src/lib/jiggle/engine.ts")
          engine = engine_path.read_text(encoding="utf-8")
          old_load = """  async loadFile(file: Blob) {
              const dataUrl = await readFile(file);
              await this.loadDataUrl(dataUrl);
            }
          """
          new_load = """  async loadFile(file: Blob) {
              if (!file.size) throw new Error("That file is empty");

              // Inspect the bytes instead of trusting the MIME type supplied
              // by the operating system. This fixes valid phone photos that
              // arrive as application/octet-stream or with no MIME type.
              const header = new Uint8Array(await file.slice(0, 12).arrayBuffer());
              let mime: string | null = null;

              const isPng =
                header.length >= 8 &&
                header[0] === 0x89 &&
                header[1] === 0x50 &&
                header[2] === 0x4e &&
                header[3] === 0x47 &&
                header[4] === 0x0d &&
                header[5] === 0x0a &&
                header[6] === 0x1a &&
                header[7] === 0x0a;
              const isJpeg =
                header.length >= 3 &&
                header[0] === 0xff &&
                header[1] === 0xd8 &&
                header[2] === 0xff;
              const isWebp =
                header.length >= 12 &&
                String.fromCharCode(...header.slice(0, 4)) === "RIFF" &&
                String.fromCharCode(...header.slice(8, 12)) === "WEBP";

              if (isPng) mime = "image/png";
              else if (isJpeg) mime = "image/jpeg";
              else if (isWebp) mime = "image/webp";

              if (!mime) {
                throw new Error("Unsupported image. Please use a PNG, JPG, or WebP file.");
              }

              const dataUrl = await readFile(file);
              const separator = dataUrl.indexOf(",");
              if (separator < 0) throw new Error("The image file could not be read");

              // Rebuild the data URL with the verified MIME type. Some
              // browsers otherwise label valid JPEG/PNG bytes as octet-stream,
              // which makes the Image decoder reject them.
              await this.loadDataUrl(`data:${mime};base64,${dataUrl.slice(separator + 1)}`);
            }
          """
          if old_load not in engine:
              raise SystemExit("Could not find the expected loadFile method in engine.ts")
          engine_path.write_text(engine.replace(old_load, new_load, 1), encoding="utf-8")

          # Make failed decodes explain which formats are supported.
          old_error = 'img.onerror = () => reject(new Error("Could not read that image"));'
          new_error = 'img.onerror = () => reject(new Error("Could not decode this image. Please use PNG, JPG, or WebP."));'
          if old_error not in engine:
              raise SystemExit("Could not find the expected image decoder error handler")
          engine_path.write_text(engine_path.read_text(encoding="utf-8").replace(old_error, new_error, 1), encoding="utf-8")
          PY

          cat > .gitignore <<'EOF'
          node_modules/
          .vercel/output/
          .vercel/cache/
          dist/
          .output/
          .tanstack/tmp/
          *.log
          .env
          .env.*
          !.env.example
          EOF

          cat > README.md <<'EOF'
          # Wobble

          Wobble is an interactive image editor. Upload a photo, paint the parts you want to move, then pull, tap, or shake them with spring-based soft-body physics.

          ## Run locally

          Requires Node.js 22 or newer.

          ```bash
          npm install
          npm run dev
          ```

          Open the local address printed by Vite (normally http://localhost:8080).

          ## Deploy as a website

          This project uses TanStack Start with Nitro's Vercel preset. It is not a plain static HTML export.

          1. Open [Vercel New Project](https://vercel.com/new).
          2. Import this GitHub repository: `alphacat731-rgb/wobble`.
          3. Keep the project root directory set to `./`.
          4. Let Vercel detect the Nitro framework and use the repository's `vercel.json` settings.
          5. Deploy. Future pushes to `main` can then deploy automatically through the Vercel Git integration.

          The `grok-workspace.zip` archive is retained as the original packaged backup. The application source is now also available directly in the repository root.
          EOF

      - name: Install dependencies
        run: npm ci

      - name: Build the production website
        run: npm run build

      - name: Verify the exact Vercel production install
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm run build

      - name: Commit the extracted application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "Extract Wobble app and fix mobile image uploads"
            git push origin HEAD:main
          fi
