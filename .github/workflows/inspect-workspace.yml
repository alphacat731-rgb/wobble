name: Inspect Wobble workspace

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-workspace.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect workspace archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q grok-workspace.zip -d extracted
          echo "===== FILE INVENTORY ====="
          find extracted -type f -printf '%P | %s bytes\n' | sort | head -250
          echo "===== WEB ENTRY POINTS ====="
          find extracted -type f \( -iname 'index.html' -o -iname 'package.json' -o -iname 'vite.config.*' -o -iname 'next.config.*' \) -print
          echo "===== HTML ENTRY CONTENT ====="
          while IFS= read -r f; do
            echo "--- $f ---"
            sed -n '1,220p' "$f"
          done < <(find extracted -type f -iname 'index.html' | head -10)
          echo "===== IMAGE HANDLING REFERENCES ====="
          grep -RInE 'FileReader|createObjectURL|revokeObjectURL|new Image\(|\.src[[:space:]]*=|<img|onload|image/png|image/jpeg|accept=.*image' extracted \
            --include='*.js' --include='*.jsx' --include='*.ts' --include='*.tsx' --include='*.html' --exclude='*.min.js' 2>/dev/null | head -250 || true
          echo "===== ROOT DIRECTORY ====="
          ls -la extracted
